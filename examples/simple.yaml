# The smallest useful Task: no Workspace or Model.
#
# The controller runs it on the default task-runner image with an empty
# /workspace directory.
#
#   ax apply -f examples/simple.yaml
#   ax describe task simple-task
#   ax ssh simple-task -- ls -la /workspace
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: simple-task
  atespace: default
spec:
  image: "gcr.io/ax-substrate/ate-images/ax-task-runner@sha256:3a0dea6ad8b55278685db58aca6e37dc4ba04056831d45bef3aaeafdca43cac6"
  env:
    - name: ENVIRONMENT
      value: "test"
  debug: true # serve guest services so `ax ssh` works; off by default
