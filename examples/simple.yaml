# The smallest useful Task: no Workspace or Model.
#
# The server runs it on the default runner image with an empty
# /workspace directory.
#
#   ax apply -f examples/simple.yaml
#   ax describe task simple-task
#   ax ssh simple-task -- ls -la /workspace
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: simple-task
  atespace: default
spec:
  profile:
    image: "ghcr.io/google/ax/ax-runner@sha256:0937ebe5ad2d8db6bb25e88ded44d2d65de1b1bd8f0a9a97c6bb3787407d9947"
  commands: ["sh", "-c", "echo $ENVIRONMENT"]
  env:
    - name: ENVIRONMENT
      value: "test"
  debug: true # serve guest services so `ax ssh` works; off by default
