# A minimal WorkerPool for AX tasks.
#
# AX runs every task as a Substrate actor, and an actor needs a free worker
# from a WorkerPool. Nothing creates one for you — not `make deploy`, and not
# the Substrate installer — so without a pool the first `ax resume` fails
# with `ResourceExhausted: no free workers available`.
#
# Worker selection is cluster-wide (matched by sandbox class and labels), so
# the namespace below only decides where the worker pods are managed.
#
# The `ko://` worker image builds from Substrate sources, so apply this file
# with `ko apply` from a Substrate checkout:
#
#   KO_DOCKER_REPO=<your-registry> ko apply -f <path-to-this-file>
#
# Substrate requires every pool to name its sandbox class. Leaving out
# `configRef` uses the platform's default gVisor SandboxConfig.
apiVersion: ate.dev/v1alpha1
kind: WorkerPool
metadata:
  name: ax-pool
  namespace: default
spec:
  replicas: 2
  workerImage: ko://go.ate.dev/substrate/cmd/ateworker-gvisor
  sandboxClasses:
    - name: gvisor
  template:
    resources:
      requests:
        cpu: "250m"
        memory: "1Gi"
      limits:
        cpu: "1"
        memory: "1Gi"
