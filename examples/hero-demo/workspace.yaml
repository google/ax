# AX v1alpha1 Workspace manifest for Step 2 of the hero demo: Warm Workspace Snapshot.
# DRI: @sizhang
#
# spec.setup runs once and is captured in the workspace snapshot, so tasks that
# bind this workspace start with /workspace/app already in place.
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: hero-demo-ws
  atespace: default
spec:
  profile:
    # TODO(@sizhang): Pin by digest once the setup image is published. Substrate
    # rejects tag-only images when it creates the actor template.
    image: ghcr.io/agentexecutor/images/workspace-setup:v0.1.0-rc1
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  setup:
    commands:
      - git init /workspace/app
      - printf "def add(a, b):\n    return a + b\n" > /workspace/app/math_utils.py
      - printf "import unittest\nfrom math_utils import add\n\nclass TestMath(unittest.TestCase):\n    def test_add(self):\n        self.assertEqual(add(2, 3), 5)\n" > /workspace/app/test_math.py
