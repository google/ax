# A Task and Workspace for local mode. No image is pinned, so the task runs on
# the default task-runner image; `make build-local-image` builds it for your
# machine.
#
#   ax apply -f examples/local.yaml
#   ax resume task hello
#   ax ssh hello -- ls /workspace/chalk
#   ax delete task hello
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: hello-ws
spec:
  git:
    - name: chalk
      repo: https://github.com/chalk/chalk.git
      branch: main
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hello
spec:
  workspace:
    name: hello-ws
  env:
    - name: GREETING
      value: hi
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
  debug: true # serve guest services so `ax ssh` works; off by default
