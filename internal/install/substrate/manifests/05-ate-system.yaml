apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-bucket-init
  namespace: ate-system
spec:
  backoffLimit: 10
  template:
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          set -e
          for i in $(seq 1 60); do
            if aws s3api head-bucket --bucket ate-snapshots 2>/dev/null; then
              echo "bucket ate-snapshots already exists"
              exit 0
            fi
            if aws s3api create-bucket --bucket ate-snapshots 2>/dev/null; then
              echo "bucket ate-snapshots created"
              exit 0
            fi
            echo "waiting for rustfs to become available... ($i/60)"
            sleep 2
          done
          echo "timed out waiting for rustfs"
          exit 1
        env:
        - name: AWS_ACCESS_KEY_ID
          value: rustfsadmin
        - name: AWS_SECRET_ACCESS_KEY
          value: rustfsadmin
        - name: AWS_REGION
          value: us-east-1
        - name: AWS_ENDPOINT_URL
          value: http://rustfs.ate-system.svc:9000
        image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
        name: create-bucket
      restartPolicy: OnFailure
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ate-controller
          - atelet
          - atenet-egress
          - atenet-router
    - namespaceSelector:
        matchLabels:
          ate.dev/api-access: "true"
      podSelector:
        matchExpressions:
        - key: ate.dev/worker-pool
          operator: DoesNotExist
    ports:
    - port: 443
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: atelet
    ports:
    - port: 8445
      protocol: TCP
  podSelector:
    matchLabels:
      app: ate-api-server
  policyTypes:
  - Ingress
---
