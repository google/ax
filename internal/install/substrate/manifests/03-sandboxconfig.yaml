# Cluster-wide SandboxConfig for the gVisor (runsc) sandbox class, shipped with
# the platform as the class default so gVisor WorkerPools resolve it unless
# they pin a specific configRef. atelet fetches the gVisor release tarball
# (gvisor.tar.zstd: runsc plus the gvisor-bin/ helpers runsc requires next to
# it) matching the worker node's architecture and extracts it locally. To pin a
# different release, add a version below and point defaultVersion at it, or
# create another SandboxConfig and reference it from the WorkerPool.
#
# A bump adds a version and points defaultVersion at it. Keep the
# previous version unless it has a known vulnerability: an actor restores its
# memory only on the version its snapshot was taken with.
apiVersion: ate.dev/v1
kind: SandboxConfig
metadata:
  name: gvisor-default
  annotations:
    sandboxconfig.ate.dev/is-class-default: "true"
spec:
  sandboxClass: gvisor
  defaultVersion: v6
  versions:
  # gVisor release 20261026.0. ateworker-gvisor saves container rootfs overlays
  # (rootfs/) and durable-dir volumes (fs/) as separate checkpoint bundles. That
  # needs google/gvisor@b79256080dec, first in tagged release 20261019.0.
  # ateworker-gvisor also runs the sandbox with no root container
  # (google/gvisor#15551). This release's restore picks each container's init
  # process correctly in such a sandbox (google/gvisor@29b97c66d945).
  - name: v6
    state: Enabled
    assets:
      amd64:
        gvisor:
          url: "gs://gvisor/releases/release/20261026.0/x86_64/gvisor.tar.zstd"
          sha256: "708afc62f2ee82d19930c703e85f9dab4f27a78c0aec40c0f55eb1040107f1a7"
      arm64:
        gvisor:
          url: "gs://gvisor/releases/release/20261026.0/aarch64/gvisor.tar.zstd"
          sha256: "6257e49955f13e6caceb2c4181c5dc5406c460e805940c944e67ad65553f5b02"
