# AX v1alpha1 Task manifest for Step 4 of the hero demo: Custom Image Task, without a starter template.
#
# Runs the workspace's unit tests in a plain Python image, in the same
# hero-demo-ws workspace as the starter task.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-custom-task
  atespace: default
spec:
  # TODO(@itssimrank): A plain image has no /usr/local/bin/ax-task-runner, so this
  # needs automatic runner injection. Pin by digest as well: Substrate rejects
  # tag-only images.
  image: python:3.12-slim
  resources:
    limits:
      cpu: "1"
      memory: "2Gi"
  workspace:
    name: hero-demo-ws
  command:
    - python3
    - -m
    - unittest
    - discover
    - -s
    - /workspace/app
    - -p
    - "test_*.py"
