# AX v1alpha1 Task manifest for Step 4 of the hero demo: Custom Image Task, without a starter template.
#
# Runs the workspace's unit tests in a plain Python image, in the same
# hero-demo-ws workspace as the starter task.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-custom-task
  atespace: default
spec:
  profile:
    # Plain Python image pinned by digest (Substrate rejects tag-only images).
    # ax-server injects /usr/local/bin/ax-task-runner automatically when
    # AX_RUNNER_VOLUME_IMAGE is configured.
    image: "python:3.12@sha256:5411fa1b302c43f510324381162b5f5d0d93b9ee2af538f09d944f0d290ee3cb"
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
  workspace:
    name: hero-demo-ws
  commands:
    - python3
    - -m
    - unittest
    - discover
    - -s
    - /workspace/app
    - -p
    - "test_*.py"
