# AX v1alpha1 Task manifest for Step 4 of the hero demo: Custom Image Task, without a starter template.
#
# Runs the workspace's unit tests in a plain Python image, in the same
# hero-demo-ws workspace as the starter task.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-custom-task
  atespace: default
spec:
  profile:
    # A plain image has no ax-runner: ax-server mounts it from its runner
    # volume image. Pinned by digest, because Substrate rejects tag-only images.
    image: "python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b"
    resources:
      limits:
        cpu: "1"
        memory: "2Gi"
  workspace:
    name: hero-demo-ws
  debug: true # serve guest services so `ax ssh` works; off by default
  # The first run leaves a marker and waits, so that the task can be suspended
  # and resumed while it runs. The command then starts again, finds the marker
  # and runs the workspace's unit tests. AX leaves command completion and output
  # on the data plane (#756), so the command writes the test output to
  # $AX_OUTPUT_FILE and its exit status to a file that run.sh reads.
  commands:
    - sh
    - -c
    - |
      if [ ! -f /workspace/first-run ]; then
        touch /workspace/first-run
        sleep 300
      fi
      python3 -m unittest discover -s /workspace/app -p "test_*.py" > "$AX_OUTPUT_FILE" 2>&1
      status=$?
      cat "$AX_OUTPUT_FILE"
      echo "$status" > /workspace/.ax/hero-demo-exit-code.tmp
      mv /workspace/.ax/hero-demo-exit-code.tmp /workspace/.ax/hero-demo-exit-code
      exit "$status"
