# AX v1alpha1 Workspace manifest for Step 2 of the hero demo: Warm Workspace Snapshot.
#
# spec.setup runs once and is captured in the workspace snapshot, so tasks that
# bind this workspace start with /workspace/app already in place.
apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
  name: hero-demo-ws
  atespace: default
spec:
  # Same image and limits as task-starter.yaml, so the starter task starts from
  # this workspace's snapshot.
  profile:
    image: "ghcr.io/agentexecutor/agy-cli@sha256:13c1957d2e790c3a981de08e3996acc268e855f2e6a79b5e931ec62e8b54c2a5"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  setup:
    # A task with another profile, such as task-custom.yaml, gets a snapshot of
    # its own, built by running these commands in its image. A plain image has
    # no git, so the repository is optional.
    commands:
      - git init /workspace/app 2>/dev/null || mkdir -p /workspace/app
      - printf "def add(a, b):\n    return a + b\n" > /workspace/app/math_utils.py
      - printf "import unittest\nfrom math_utils import add\n\nclass TestMath(unittest.TestCase):\n    def test_add(self):\n        self.assertEqual(add(2, 3), 5)\n" > /workspace/app/test_math.py
