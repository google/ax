# AX v1alpha1 Task manifest for Step 3 of the hero demo: Starter Task, Session & Resume.
#
# Runs the prebuilt Antigravity starter image against the hero-demo-ws workspace.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-starter-task
  atespace: default
spec:
  profile:
    # Antigravity starter image published from github.com/agentexecutor/images
    # (v0.0.0-rc.2, pinned by digest; pass STARTER_IMAGE to hack/hero-demo/run.sh
    # to override). Substrate rejects tag-only images when it creates the actor
    # template. Keep the image and limits identical to workspace.yaml, so the
    # task starts from the workspace's pre-warmed snapshot.
    image: "ghcr.io/agentexecutor/antigravity@sha256:0ccd91d03f996c375d6d391dc20106102187f15210a0016212b6721cd8044078"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  workspace:
    name: hero-demo-ws
  gateway:
    name: hero-demo-gw
  env:
    - name: AGY_RUNTIME_INSTALL
      value: "true" # published starter image installs pinned agy at startup
    - name: GEMINI_API_KEY
      value: placeholder # replaced outside the sandbox by hero-demo-gw
  sessionId: hero-demo-session
  goal:
    text: "Add a subtract(a, b) function to /workspace/app/math_utils.py and a unit test in test_math.py."
  debug: true # serve guest services so `ax ssh` works; off by default
  # Runs the image's launcher, as the runner does for a task with a goal and no
  # commands, and reports how it ended in the status file ($AX_STATUS_FILE),
  # which AX records as the task's state. A command still gets the goal,
  # config, MCP and session files. Once the status file exists, a restarted
  # command does not run the agent again.
  commands:
    - sh
    - -c
    - |
      [ -f "$AX_STATUS_FILE" ] && exit 0
      launcher=/usr/local/bin/ax-launcher
      [ -x "$launcher" ] || launcher=/usr/local/bin/ax-harness # images before the rename
      if "$launcher"; then
        status='{"state": "COMPLETED"}'
      else
        status="{\"state\": \"FAILED\", \"output\": \"the launcher exited with status $?\"}"
      fi
      mkdir -p "$(dirname "$AX_STATUS_FILE")"
      echo "$status" > "$AX_STATUS_FILE.tmp"
      mv "$AX_STATUS_FILE.tmp" "$AX_STATUS_FILE"
