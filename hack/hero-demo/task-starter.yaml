# AX v1alpha1 Task manifest for Step 3 of the hero demo: Starter Task, Session & Resume.
#
# Runs the prebuilt Antigravity starter image against the hero-demo-ws workspace.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-starter-task
  atespace: default
spec:
  profile:
    # TODO(@Lukeluds): Replace with the Antigravity starter image published from
    # github.com/agentexecutor/images, pinned by digest (or pass STARTER_IMAGE
    # to hack/hero-demo/run.sh). Substrate rejects tag-only images when it
    # creates the actor template.
    image: "<starter-image>@sha256:<digest>"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  workspace:
    name: hero-demo-ws
  gateway:
    name: hero-demo-gw
  env:
    - name: GEMINI_API_KEY
      value: placeholder # replaced outside the sandbox by hero-demo-gw
  sessionId: hero-demo-session
  goal:
    text: "Add a subtract(a, b) function to /workspace/app/math_utils.py and a unit test in test_math.py."
  debug: true # serve guest services so `ax ssh` works; off by default
