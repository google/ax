# AX v1alpha1 Task manifest for Step 3 of the hero demo: Starter Task, Session & Resume.
#
# Runs the prebuilt Antigravity starter image against the hero-demo-ws workspace.
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
  name: hero-demo-starter-task
  atespace: default
spec:
  profile:
    # Antigravity CLI starter image published from github.com/agentexecutor/images
    # (v0.0.0-rc.4, pinned by digest; pass STARTER_IMAGE to hack/hero-demo/run.sh
    # to override). Substrate rejects tag-only images when it creates the actor
    # template. Keep the image and limits identical to workspace.yaml, so the
    # task starts from the workspace's pre-warmed snapshot.
    image: "ghcr.io/agentexecutor/agy-cli@sha256:0d459fee234a47ab9cc56996b65711097e4ac1b18641ec252fdd960aacb74ef6"
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
  workspace:
    name: hero-demo-ws
  gateway:
    name: hero-demo-gw
  env:
    - name: GEMINI_API_KEY
      value: placeholder # replaced outside the sandbox by hero-demo-gw
  sessionId: hero-demo-session
  goal:
    text: "Add a subtract(a, b) function to /workspace/app/math_utils.py and a unit test in test_math.py."
  debug: true # serve guest services so `ax ssh` works; off by default
  # Runs the image's launcher, as the runner does for a task with a goal and no
  # commands, and records how it ended. AX leaves command completion and output
  # on the data plane (#756), so run.sh reads the exit status from the file below
  # and the agent's answer from $AX_OUTPUT_FILE. A command still gets the goal,
  # config, MCP and session files. Once the status is recorded, a restarted
  # command does not run the agent again.
  commands:
    - sh
    - -c
    - |
      status_file=/workspace/.ax/hero-demo-exit-code
      [ -f "$status_file" ] && exit "$(cat "$status_file")"
      launcher=/usr/local/bin/ax-launcher
      [ -x "$launcher" ] || launcher=/usr/local/bin/ax-harness # images before the rename
      "$launcher"
      status=$?
      echo "$status" > "$status_file.tmp"
      mv "$status_file.tmp" "$status_file"
      exit "$status"
