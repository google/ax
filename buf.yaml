version: v2
modules:
  - path: . # imports are repo-root-relative
    includes:
      - pkg/apis
  - path: .tmp/buf/substrate # go.ate.dev/substrate, linked by `make generate`
    includes:
      - .tmp/buf/substrate/api/ateapi/v1
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH # package ax.v1alpha1 is in pkg/apis/v1alpha1
    - SERVICE_SUFFIX # the service is named AX
    - RPC_RESPONSE_STANDARD_NAME # standard methods return the resource itself
    - RPC_REQUEST_RESPONSE_UNIQUE # same
# Not needed while the API is v1alpha1.
# breaking:
#   use:
#     - WIRE_JSON
