# Optional: apply only when enabling task logs. This namespace must contain
# the worker pool; the subject namespace must contain ax-server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ax-task-logs
  namespace: ax-system
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ax-task-logs
  namespace: ax-system
subjects:
  - kind: ServiceAccount
    name: ax-server
    namespace: ax-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ax-task-logs
