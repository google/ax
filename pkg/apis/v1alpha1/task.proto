syntax = "proto3";

package ax.v1alpha1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "pkg/apis/v1alpha1/common.proto";
import "pkg/apis/v1alpha1/gateway.proto";
import "pkg/apis/v1alpha1/workspace.proto";

option go_package = "github.com/google/ax/pkg/apis/v1alpha1";

message Task {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  TaskSpec spec = 4;
  // Set by the server; ignored on input.
  TaskStatus status = 5;
}

message TaskSpec {
  // Compute profile (image, resources, ate_template) for this task's sandbox.
  // There is no server-wide default image, so the task must get one from here
  // or from its bound Workspace.
  //
  // Precedence is whole-profile, never field-merged with WorkspaceSpec.profile:
  //   - If omitted (or empty), the task uses the bound Workspace's
  //     spec.profile (hitting its pre-warmed workspace snapshot). The task is
  //     rejected if it binds no Workspace or its Workspace has no profile.
  //   - If set (any field populated), it must set image or ate_template.name
  //     and is used as-is; WorkspaceSpec.profile is ignored and unset resource
  //     limits fall back to server defaults. When it differs from
  //     WorkspaceSpec.profile, the task cold-boots and runs workspace setup in
  //     its own compute profile instead of starting from the pre-warmed
  //     snapshot.
  Profile profile = 1;

  // Command argv; if empty, runs the resolved image's ENTRYPOINT + CMD in its WORKDIR.
  repeated string commands = 2;

  // Non-secret environment variables merged on top of the image's Env.
  repeated EnvVar env = 3;

  // workspace binds the Workspace the task works in. It is mounted at
  // /workspace unless the binding sets a path, and that path is the task
  // command's working directory. A task without a workspace gets an empty
  // working directory at /workspace.
  WorkspaceRef workspace = 4;

  // debug enables the in-container guest services (process execution and file
  // access) that back `ax ssh`. Off by default.
  bool debug = 5;

  // config is free-form, runner-defined configuration. AX stores it and
  // hands it to the runner as-is, as part of the Task in AX_TASK_YAML and
  // the task metadata endpoint. The control plane only checks that it is an
  // object within 16 KiB; it does not validate or interpret it.
  // It is stored in plain text and shown by `ax get task`, so it must not
  // hold secrets.
  google.protobuf.Struct config = 6;

  // Optional natural-language task goal.
  Goal goal = 7;

  // Retries after a failed exit, sandbox crash, or lost runner.
  RetryConfig retry = 8;

  // gateway binds the Gateway whose rules allow the task's external network
  // traffic. Rules are copied onto the actor when the task is created (later
  // edits or deletes of the gateway don't change existing tasks, and binding a
  // missing gateway fails). A task without a Gateway has no external network
  // access.
  GatewayRef gateway = 9;

  // Logical multi-turn session / conversation thread ID. Defaults to
  // metadata.uid on CreateTask if unset.
  string session_id = 10;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

message RetryConfig {
  // Retries per turn (attempt runs 1 … max_retries + 1).
  int32 max_retries = 1;
  // Delay before the first retry. Default 0 (retry immediately).
  google.protobuf.Duration initial_backoff = 2;
  // Cap on retry delay. Default 5m.
  google.protobuf.Duration max_backoff = 3;
  // Multiplier applied after each retry (must be >= 1.0 when set).
  double backoff_multiplier = 4;
}

message Goal {
  // Goal as natural language.
  string text = 1;
}

// TaskState is where a task is in its lifecycle.
//
// Values below 200 are the state of the task's actor on Agent Substrate, with
// the same names and numbers as Substrate's ActorState; they are read from the
// actor and never stored. Values from 200 are AX's own states, stored by
// ax-server.
enum TaskState {
  // Reserved for ActorState values Substrate may add.
  reserved 8 to 199;

  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_RESUMING = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUSPENDING = 3;
  TASK_STATE_SUSPENDED = 4;
  TASK_STATE_CRASHED = 5;
  TASK_STATE_DELETING = 6;
  TASK_STATE_REVERTING = 7;
  // ResumeTask failed with a transient Substrate error and can be called
  // again.
  TASK_STATE_QUEUED = 200;
}

message TaskStatus {
  string actor = 1;
  // actor_uid is the current actor's Substrate UID (ate.actor.uid in telemetry).
  // Read from Substrate, never stored; empty when the actor cannot be read.
  string actor_uid = 2;
  ObjectRef ate_template = 3;
  repeated Condition conditions = 4;
  TaskState state = 5;
  // 1-based execution attempt counter (1 … spec.retry.max_retries + 1).
  // Starts at 1 on CreateTask; increments (+1) only when a failure consumes a
  // retry (non-zero command exit, sandbox crash, or lost runner).
  int32 attempt = 6;
  // Effective command argv executed by each run: spec.commands if set,
  // otherwise the image's ENTRYPOINT + CMD.
  repeated string resolved_argv = 7;
}

// --- RPC Request & Response Messages ---

// Tasks
message GetTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ListTasksRequest {
  string atespace = 1;
  // Maximum number of tasks to return; the server may return fewer. If unset,
  // at most 50 are returned. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  // Page token from a previous ListTasks response. Leave empty for the first
  // page.
  string page_token = 3;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  // Token for the next page. Empty if this is the last page.
  string next_page_token = 2;
}

message CreateTaskRequest {
  Task task = 1;
}

message DeleteTaskRequest {
  string atespace = 1;
  string name = 2;
}

message SuspendTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ResumeTaskRequest {
  string atespace = 1;
  string name = 2;
}
