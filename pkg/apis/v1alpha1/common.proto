syntax = "proto3";

package ax.v1alpha1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/google/ax/pkg/apis/v1alpha1";

// ObjectMeta is metadata for AX resources.
message ObjectMeta {
  // +k8s:required
  // +k8s:format=k8s-short-name
  string name = 1;
  // +k8s:optional
  // +k8s:format=k8s-short-name
  string atespace = 2;
  // Set by the server; ignored on input.
  google.protobuf.Timestamp create_time = 3;
  // Server-assigned UUID; ignored on input.
  string uid = 4;
  // Arbitrary key-value labels.
  map<string, string> labels = 5;
  // Authenticated creator identity.
  string owner = 6;
  // Set by the server; ignored on input.
  google.protobuf.Timestamp update_time = 7;
  // Set while resource deletion is in progress; ignored on input.
  google.protobuf.Timestamp delete_time = 8;
}

message ResourcesSpec {
  ResourceList limits = 1;
}

message ResourceList {
  string cpu = 1;
  string memory = 2;
}

message Condition {
  string type = 1;
  string status = 2;
  google.protobuf.Timestamp update_time = 3;
  string reason = 4;
  string message = 5;
}

// Profile defines the compute environment that maps 1:1 to a shared Substrate
// ActorTemplate (ax-<sha256[:16]>) within an atespace. AX-managed templates
// synthesized from a Profile default to ROOTFS snapshot fidelity
// (SNAPSHOT_FIDELITY_ROOTFS) so root filesystem changes made during workspace
// setup persist across snapshots.
message Profile {
  // Container image (Substrate requires @sha256 digest pinning on templates).
  string image = 1;
  // Sandbox compute resource limits (CPU and memory).
  ResourcesSpec resources = 2;
  // Optional reference to an existing Substrate ActorTemplate to use directly
  // instead of generating an AX-managed template. Mutually exclusive with
  // image and resources. Because AX does not synthesize or mutate a
  // user-supplied template, it must already satisfy the AX sandbox contract
  // (/usr/local/bin/ax-runner entrypoint, HTTP /readyz wakeup probe on
  // port 80, durable /workspace volume, and the egress-trust-bundle SystemInfo
  // mount at /run/ate/egress-trust-bundle/trust-bundle.pem when outbound HTTPS
  // traverses a Gateway).
  ObjectRef ate_template = 3;
}

// ObjectRef names another resource, optionally in a different atespace.
message ObjectRef {
  // Name of the referenced resource.
  string name = 1;
  // Atespace of the referenced resource. Defaults to the referrer's own
  // atespace (metadata.atespace) when empty.
  string atespace = 2;
}
