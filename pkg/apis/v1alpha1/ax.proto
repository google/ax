syntax = "proto3";

package ax.v1alpha1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/google/ax/pkg/apis/v1alpha1";

// AX defines the core control plane gRPC service for autonomous agent orchestration.
service AX {
  // Manifests are parsed by the client (see `ax apply`) and submitted through the
  // typed Update* RPCs below; the server never receives raw YAML.

  // Tasks
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse);
  rpc SuspendTask(SuspendTaskRequest) returns (Task);
  rpc ResumeTask(ResumeTaskRequest) returns (Task);
  rpc WatchTask(WatchTaskRequest) returns (stream WatchTaskResponse);


  // Workspaces
  rpc GetWorkspace(GetWorkspaceRequest) returns (Workspace);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc UpdateWorkspace(UpdateWorkspaceRequest) returns (Workspace);
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse);

  // Models
  rpc GetModel(GetModelRequest) returns (Model);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc UpdateModel(UpdateModelRequest) returns (Model);
  rpc DeleteModel(DeleteModelRequest) returns (DeleteModelResponse);

  // SecretStores
  rpc GetSecretStore(GetSecretStoreRequest) returns (SecretStore);
  rpc ListSecretStores(ListSecretStoresRequest) returns (ListSecretStoresResponse);
  rpc UpdateSecretStore(UpdateSecretStoreRequest) returns (SecretStore);
  rpc DeleteSecretStore(DeleteSecretStoreRequest) returns (DeleteSecretStoreResponse);

}

// ObjectMeta is metadata for AX resources.
message ObjectMeta {
  string name = 1;
  string atespace = 2;
  google.protobuf.Timestamp create_time = 3;
}

// --- Task ---

message Task {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  TaskSpec spec = 4;
  TaskStatus status = 5;
}

message TaskSpec {
  string image = 1;
  repeated string command = 2;
  repeated EnvVar env = 3;
  ResourcesSpec resources = 4;
  // workspaces binds one or more Workspaces, each mounted at its own path
  // under /workspace. The first entry is the task command's working directory.
  repeated WorkspaceRef workspaces = 5;
  // debug enables the in-container guest services (process execution and file
  // access) that back `ax ssh`. Off by default.
  bool debug = 6;
  // egress lists the outbound destinations the task may reach. Agent Substrate
  // denies all actor egress by default, so a task without egress has no network
  // access. Hosts named by an env secret_ref are allowed automatically.
  EgressSpec egress = 7;
}

message EgressSpec {
  // hosts are DNS names the task may reach over TLS on port 443, or a DNS name
  // with "*" as its leftmost label, such as "*.googleapis.com".
  repeated string hosts = 1;
}

message EnvVar {
  string name = 1;
  // value is a literal value. Exactly one of value and secret_ref is set.
  string value = 2;
  // secret_ref injects a secret into the task's outbound requests instead of
  // exposing it to the task. The variable is set to a placeholder, and Agent
  // Substrate's egress gateway replaces the named request header with the
  // secret on requests to the given host.
  SecretEnvSource secret_ref = 3;
}

// SecretEnvSource names a secret in one of the atespace's SecretStores, and how
// the egress gateway injects it.
message SecretEnvSource {
  // store is the SecretStore holding the secret. Empty means "default".
  string store = 4;
  string name = 1;
  string key = 2;
  CredentialInjection inject = 3;
}

// CredentialInjection tells the egress gateway where to put a secret: in the
// given request header, on HTTPS requests to host.
message CredentialInjection {
  // host is the DNS name requests are sent to, such as "api.stripe.com".
  string host = 1;
  // header is the request header the gateway replaces, such as "Authorization".
  string header = 2;
  // prefix is prepended to the secret, such as "Bearer " (including the space).
  string prefix = 3;
}

message ResourcesSpec {
  ResourceList requests = 1;
  ResourceList limits = 2;
}

message ResourceList {
  string cpu = 1;
  string memory = 2;
}

message WorkspaceRef {
  string name = 1;
  string path = 2;
  // TODO(jbd): Consider removing goal.
  string goal = 3;
}

message TaskStatus {
  string phase = 1;
  string id = 2;
  string actor = 3;
  // json_name keeps the established `workerIP` spelling in YAML and JSON.
  string worker_ip = 4 [json_name = "workerIP"];
  repeated Condition conditions = 7;
}

message Condition {
  string type = 1;
  string status = 2;
  google.protobuf.Timestamp update_time = 3;
  string reason = 4;
  string message = 5;
}

// --- Workspace ---

message Workspace {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  WorkspaceSpec spec = 4;
}

message WorkspaceSpec {
  repeated GitRepo git = 1;
  repeated File files = 2;
  MCPConfig mcp = 3;
  SkillsConfig skills = 4;
}

message GitRepo {
  string name = 1;
  string repo = 2;
  string branch = 3;
  string dir = 4;
  int32 depth = 5;
}

message File {
  string path = 1;
  string content = 2;
}

message MCPConfig {
  repeated MCPRegistry registries = 1;
  repeated MCPServer servers = 2;
}

message MCPRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
  repeated MCPServer servers = 4;
}

message MCPServer {
  string name = 1;
  string endpoint = 2;
  string command = 3;
  repeated string args = 4;
}

message SkillsConfig {
  repeated SkillRegistry registries = 1;
  string path = 2;
}

message SkillRegistry {
  string provider = 1;
  string project = 2;
  string query = 3;
}

// --- Model ---

message Model {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  ModelSpec spec = 4;
}

message ModelSpec {
  string provider = 1;
  string model = 2;
  SecretKeyRef secret_key = 3;
  // parameters are provider-specific generation settings passed through to the
  // model API as-is, for example temperature or maxOutputTokens for Gemini.
  google.protobuf.Struct parameters = 4;
}

message SecretKeyRef {
  string name = 1;
  string key = 2;
}

// --- RPC Request & Response Messages ---

// Tasks
message GetTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ListTasksRequest {
  string atespace = 1;
  int64 limit = 2;
  int64 offset = 3;
}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message CreateTaskRequest {
  Task task = 1;
}

message DeleteTaskRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteTaskResponse {}

message SuspendTaskRequest {
  string atespace = 1;
  string name = 2;
}

message ResumeTaskRequest {
  string atespace = 1;
  string name = 2;
}

message WatchTaskRequest {
  string atespace = 1;
  string name = 2;
}

message WatchTaskResponse {
  Task task = 1;
  string action = 2;
}

// Workspaces
message GetWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message ListWorkspacesRequest {
  string atespace = 1;
}

message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
}

message UpdateWorkspaceRequest {
  Workspace workspace = 1;
}

message DeleteWorkspaceRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteWorkspaceResponse {}

// --- SecretStore ---

// SecretStore tells AX where an atespace's secrets live. Tasks reference
// secrets by store, name, and key, and AX turns that into a credential
// reference that Agent Substrate's egress gateway resolves, so tasks never
// hold the secret itself.
message SecretStore {
  string api_version = 1;
  string kind = 2;
  ObjectMeta metadata = 3;
  SecretStoreSpec spec = 4;
}

message SecretStoreSpec {
  // kubernetes reads secrets from Kubernetes Secrets through Substrate's
  // k8s.io credential provider. Exactly one backend is set.
  KubernetesSecretStore kubernetes = 1;
}

message KubernetesSecretStore {
  // namespace holds the Secrets. Empty means the namespace named after the
  // store's atespace. Substrate's credential provider must grant the atespace
  // access to this namespace.
  string namespace = 1;
}

// Models
message GetModelRequest {
  string atespace = 1;
  string name = 2;
}

message ListModelsRequest {
  string atespace = 1;
}

message ListModelsResponse {
  repeated Model models = 1;
}

message UpdateModelRequest {
  Model model = 1;
}

message DeleteModelRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteModelResponse {}

// SecretStores
message GetSecretStoreRequest {
  string atespace = 1;
  string name = 2;
}

message ListSecretStoresRequest {
  string atespace = 1;
}

message ListSecretStoresResponse {
  repeated SecretStore secret_stores = 1;
}

message UpdateSecretStoreRequest {
  SecretStore secret_store = 1;
}

message DeleteSecretStoreRequest {
  string atespace = 1;
  string name = 2;
}

message DeleteSecretStoreResponse {}

