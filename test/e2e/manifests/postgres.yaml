# PostgreSQL for the E2E suite. hack/setup-e2e-kind.sh creates the
# ax-postgres Secret and wipes the volume before every run.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ax-postgres
  namespace: ${AX_SYSTEM_NAMESPACE}
  labels:
    app.kubernetes.io/name: ax-postgres
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  serviceName: ax-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-postgres
    spec:
      # Give Postgres time for a clean shutdown checkpoint.
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: ax
            - name: POSTGRES_DB
              value: ax
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ax-postgres
                  key: password
            # A subdirectory, because the volume root may contain lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ax", "-d", "ax"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: ax-postgres
          app.kubernetes.io/part-of: ax
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ax-postgres
  namespace: ${AX_SYSTEM_NAMESPACE}
  labels:
    app.kubernetes.io/name: ax-postgres
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: ax-postgres
