apiVersion: v1
kind: ServiceAccount
metadata:
  name: ax-server
  namespace: ${AX_SYSTEM_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ax-server
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ax-server
subjects:
  - kind: ServiceAccount
    name: ax-server
    namespace: ${AX_SYSTEM_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ax-server
---
# OpenTelemetry settings for ax-server, read with envFrom. Point ax-server at a
# collector here; see docs/observability.md. On a cluster that runs Agent
# Substrate, the endpoint can be the one in ate-system's ate-otel-config.
# Editing this ConfigMap does not restart ax-server; follow a change with
# `kubectl -n ${AX_SYSTEM_NAMESPACE} rollout restart deployment/ax-server`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ax-otel-config
  namespace: ${AX_SYSTEM_NAMESPACE}
data:
  # The collector Substrate's kind overlay deploys (hack/setup-e2e-kind.sh
  # installs Substrate with --kind). console keeps events in kubectl logs too.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.otel-system.svc:4317
  OTEL_LOGS_EXPORTER: otlp,console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-server
  namespace: ${AX_SYSTEM_NAMESPACE}
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ax-server
    spec:
      serviceAccountName: ax-server
      containers:
        - name: ax-server
          image: ${AX_SERVER_IMAGE}
          imagePullPolicy: IfNotPresent
          args:
            - "--addr=:8080"
            - "--store=postgres://ax@ax-postgres.${AX_SYSTEM_NAMESPACE}.svc.cluster.local:5432/ax?sslmode=disable"
            - "--substrate-endpoint=api.ate-system.svc.cluster.local:443"
            - "--substrate-authority=api.ate-system.svc"
            - "--substrate-token-file=/var/run/secrets/ateapi/token"
            - "--substrate-ca-file=/run/servicedns-ca/trust-bundle.pem"
            - "--template=default-template"
            - "--template-atespace=${AX_SYSTEM_NAMESPACE}"
          envFrom:
            - configMapRef:
                name: ax-otel-config
          env:
            # The resource attributes come from the downward API. Kubernetes
            # expands $(VAR) only for a variable listed earlier.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: ax-postgres
                  key: password
            - name: ATENET_ROUTER_ADDR
              value: "https://atenet-router.ate-system.svc.cluster.local:443"
            - name: AX_DEFAULT_TASK_IMAGE
              value: "${AX_DEFAULT_TASK_IMAGE}"
            - name: AX_RUNNER_VOLUME_IMAGE
              value: "${AX_RUNNER_VOLUME_IMAGE}"
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/run/secrets/ateapi
              name: ate-token
              readOnly: true
            - mountPath: /run/servicedns-ca
              name: servicedns-ca
              readOnly: true
            - mountPath: /run/podidentity.podcert.ate.dev
              name: podidentity
              readOnly: true
      volumes:
        - name: ate-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: api.ate-system.svc
                  expirationSeconds: 7200
                  path: token
        - name: servicedns-ca
          projected:
            defaultMode: 420
            sources:
              - clusterTrustBundle:
                  labelSelector:
                    matchLabels:
                      podcert.ate.dev/canarying: live
                  path: trust-bundle.pem
                  signerName: servicedns.podcert.ate.dev/identity
        - name: podidentity
          projected:
            defaultMode: 420
            sources:
              - podCertificate:
                  credentialBundlePath: credential-bundle.pem
                  keyType: ECDSAP256
                  signerName: podidentity.podcert.ate.dev/identity
---
apiVersion: v1
kind: Service
metadata:
  name: ax-server
  namespace: ${AX_SYSTEM_NAMESPACE}
  labels:
    app.kubernetes.io/name: ax-server
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app.kubernetes.io/name: ax-server
---
apiVersion: v1
kind: Service
metadata:
  name: ax-runner
  namespace: ${AX_SYSTEM_NAMESPACE}
  labels:
    app.kubernetes.io/name: ax-runner
    app.kubernetes.io/part-of: ax
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: runner
  selector:
    app.kubernetes.io/name: ax-server
---
# ax-server's gRPC control plane (:8080) and metrics (:9090) do not
# authenticate callers, so worker pods and the egress gateway must not reach
# them. The internal runner HTTP endpoint (:8081, Service ax-runner) is
# reachable only from Substrate's egress gateway (atenet-egress), which
# injects the Actor JWT; worker pods cannot reach ax-server on any port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ax-server
  namespace: ${AX_SYSTEM_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ax-server
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
      from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: ate.dev/worker-pool
                operator: DoesNotExist
              - key: app
                operator: NotIn
                values: ["atenet-egress"]
    - ports:
        - protocol: TCP
          port: 8081
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ate-system
          podSelector:
            matchLabels:
              app: atenet-egress
