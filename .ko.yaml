defaultBaseImage: cgr.dev/chainguard/static:latest
baseImageOverrides:
  github.com/google/ax/cmd/ax-task-runner: alpine/git:latest
builds:
  - id: ax-server
    main: ./cmd/ax-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
  - id: ax-task-runner
    main: ./cmd/ax-task-runner
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w

