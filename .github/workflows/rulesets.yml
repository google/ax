# Compares .github/rulesets/*.json with the rulesets live on GitHub.
# See docs/rulesets.md.

name: Rulesets

on:
  # Show reviewers what a ruleset change would do once applied.
  pull_request:
    branches: [ "main" ]
    paths:
    - '.github/rulesets/**'
    - 'hack/apply-rulesets.sh'
  # Fail when the live rulesets drift from the files, for example after a
  # merged change that no admin has applied yet, or an edit in the UI.
  schedule:
  - cron: '0 7 * * *'  # every day at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rulesets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Show differences from the live rulesets
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: hack/apply-rulesets.sh --dry-run

    - name: Check for drift from the live rulesets
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: hack/apply-rulesets.sh --check
