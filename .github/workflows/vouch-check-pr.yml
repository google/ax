name: Vouch - Check PR

# pull_request_target is required so the token can comment on and close pull
# requests from forks. This is safe here because the workflow never checks out
# or runs code from the pull request and only reads the PR author and number.
# It must stay that way.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: mitchellh/vouch/action/check-pr@d66fa29a64600490892131ad87597c30c91fcac4 # v1.5.0
      with:
        pr-number: ${{ github.event.pull_request.number }}
        auto-close: true
        # Report what would happen without closing anything.
        dry-run: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
