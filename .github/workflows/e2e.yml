name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Nightly run against Substrate main to catch incompatibilities with
  # unreleased Substrate changes early. Never blocks PRs.
  schedule:
  - cron: '0 6 * * *'  # every day at 06:00am UTC
  workflow_dispatch:
    inputs:
      substrate_ref:
        description: 'Substrate branch, tag, or commit to test against (default: version in go.mod)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  e2e-kind:
    name: E2E (Kind / Substrate ${{ github.event_name == 'schedule' && 'main' || inputs.substrate_ref || 'go.mod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout AX
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: go.mod

    - name: Install Kind
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        install_only: true

    # Substrate images for the go.mod version are built once and cached as the
    # local registry's storage; later runs install them pre-built instead of
    # compiling Substrate. The nightly and custom-ref runs build from source.
    - name: Resolve Substrate image cache key
      id: substrate
      if: github.event_name != 'schedule' && inputs.substrate_ref == ''
      run: |
        echo "version=$(go list -m -f '{{.Version}}' go.ate.dev/substrate)" >> "${GITHUB_OUTPUT}"
        echo "cache_dir=${GITHUB_WORKSPACE}/.tmp/substrate-registry" >> "${GITHUB_OUTPUT}"

    - name: Restore Substrate image cache
      id: substrate-cache
      if: steps.substrate.outputs.version != ''
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.substrate.outputs.cache_dir }}
        key: substrate-images-${{ runner.os }}-${{ runner.arch }}-${{ steps.substrate.outputs.version }}

    # The runner is discarded after the job, so the cluster is left running for
    # the diagnostics step below rather than cleaned up.
    # PRs and pushes test the Substrate version in go.mod, so they are not
    # blocked by unreleased changes on Substrate main. The nightly run tests
    # main; manual runs test the requested ref (go.mod if empty).
    - name: Run Kind E2E suite
      env:
        EVENT: ${{ github.event_name }}
        INPUT_REF: ${{ inputs.substrate_ref }}
        SUBSTRATE_IMAGE_CACHE_DIR: ${{ steps.substrate.outputs.cache_dir }}
      run: |
        if [[ "${EVENT}" == "schedule" ]]; then
          make test-e2e-head
        else
          make test-e2e ${INPUT_REF:+SUBSTRATE_REF="${INPUT_REF}"}
        fi

    - name: Collect cluster diagnostics on failure
      if: failure()
      env:
        KUBECONFIG: .tmp/kubeconfig-ax-e2e
      run: |
        [[ -f "${KUBECONFIG}" ]] || exit 0
        kubectl get pods -A -o wide || true
        kubectl -n ax-system logs deployment/ax-server --tail=200 || true
        kubectl -n ate-system logs deployment/ate-api-server --all-containers --tail=200 || true

    # The registry also holds AX's own images, which are rebuilt every run.
    # Drop them so the cache holds only the Substrate images.
    - name: Prune Substrate image cache
      if: success() && steps.substrate.outputs.version != '' && steps.substrate-cache.outputs.cache-hit != 'true'
      env:
        CACHE_DIR: ${{ steps.substrate.outputs.cache_dir }}
      run: |
        sudo rm -rf "${CACHE_DIR}"/docker/registry/v2/repositories/ax-*
        docker exec kind-registry registry garbage-collect --delete-untagged /etc/distribution/config.yml > /dev/null
        sudo chown -R "$(id -u):$(id -g)" "${CACHE_DIR}"
        du -sh "${CACHE_DIR}"

    - name: Upload Substrate image cache
      if: success() && steps.substrate.outputs.version != '' && steps.substrate-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.substrate.outputs.cache_dir }}
        key: ${{ steps.substrate-cache.outputs.cache-primary-key }}
