name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Nightly run against the Substrate release in go.mod, so breakage from
  # outside this repo (Kind, runner images, ghcr.io) shows up without a PR.
  schedule:
  - cron: '0 6 * * *'  # every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      substrate_ref:
        description: 'Substrate release tag to test against, vX.Y.Z or vX.Y.Z-rc.N (default: version in go.mod)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  e2e-kind:
    name: E2E (Kind / Substrate ${{ inputs.substrate_ref || 'go.mod' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout AX
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Go
      uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
      with:
        go-version-file: go.mod

    - name: Install Kind
      uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      with:
        install_only: true

    # Substrate is installed from the release's published images in
    # ghcr.io/agent-substrate/substrate, never built. PRs and pushes test the
    # release in go.mod, as does the nightly run; manual runs test the requested
    # release tag.
    # The runner is discarded after the job, so the cluster is left running for
    # the diagnostics step below rather than cleaned up.
    - name: Run Kind E2E suite
      env:
        INPUT_REF: ${{ inputs.substrate_ref }}
      run: make test-e2e ${INPUT_REF:+SUBSTRATE_REF="${INPUT_REF}"}

    - name: Collect cluster diagnostics on failure
      if: failure()
      env:
        KUBECONFIG: .tmp/kubeconfig-ax-e2e
      run: |
        [[ -f "${KUBECONFIG}" ]] || exit 0
        kubectl get pods -A -o wide || true
        kubectl -n ax-system logs deployment/ax-server --tail=200 || true
        kubectl -n ate-system logs deployment/ate-api-server --all-containers --tail=200 || true
